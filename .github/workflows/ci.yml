name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The unit tests cover the pure logic in src/domain and need no native dependencies.
      - run: npx --yes tsx@4 --test tests/*.test.ts
